# Render Blueprint for the API (docs/deployment.md walks through it).
# Values marked `sync: false` are entered in the Render dashboard when the
# Blueprint is applied; they are never stored in this repository.
services:
  - type: web
    name: training-lms-api
    runtime: node
    # Free instances sleep after 15 idle minutes (about a minute to wake up).
    # Choose a paid plan to avoid that; nothing else depends on the plan.
    plan: free
    # The repository root: npm workspaces need the root package-lock.json.
    buildCommand: npm ci --omit=dev --workspace server
    startCommand: npm start --workspace server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # https://<your-app>.vercel.app (and a custom domain, comma-separated)
      - key: CLIENT_ORIGINS
        sync: false
      # Measured after the first deploy with PROXY_DIAGNOSTICS (docs/deployment.md, step 6).
      - key: TRUST_PROXY
        sync: false
      # The same value as the ORIGIN_SECRET variable of the Vercel project (docs/deployment.md, step 4).
      # Without it the API refuses to start; with it, only requests through Vercel are served.
      - key: ORIGIN_SECRET
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      # https://<account id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
