<!doctype html>
<html lang="en">
  <head>
    <script>
      // Prevent theme flash (FOUC) — runs before any CSS is parsed.
      (function () {
        var t = localStorage.getItem('lms-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.setProperty('color-scheme', t);
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Courses, roadmaps and assignments for full-stack training." />
    <title>Training LMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
